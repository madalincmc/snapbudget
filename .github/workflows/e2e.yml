name: E2E

# Runs on pull requests as well as merges, which is only possible because the
# suites no longer touch the real project: a Supabase stack is started on the
# runner, migrations are applied to it, and it is thrown away with the job.
# Nothing here is secret, so a fork's pull request is not a problem — and the
# tests can gate a merge rather than only report after one.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Browser and RLS suites
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Postgres, GoTrue and PostgREST in containers on the runner. The
      # migrations in supabase/migrations are applied to it, so the schema and
      # every row-level security policy under test are the real ones.
      - name: Start Supabase
        run: npx supabase start

      - name: Apply migrations
        run: npx supabase db reset --no-seed

      # The local stack's keys are fixed values published in Supabase's own
      # documentation — identical on every machine — so they are read at run
      # time rather than stored anywhere. Nothing below is a credential.
      - name: Export local credentials
        run: |
          eval "$(npx supabase status -o env | sed 's/^/export /')"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "POSTGRES_URL_NON_POOLING=$DB_URL"
          } >> "$GITHUB_ENV"

      # Fails loudly and early if the local image lacks something the schema
      # needs, rather than letting a later suite fail for an obscure reason.
      - name: Verify schema prerequisites
        run: |
          npx supabase db execute --query "
            select extname from pg_extension where extname in ('pg_cron','pg_trgm');
            select count(*) as budget_policies from pg_policies where tablename = 'budgets';
          "

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Browser suite
        run: npm run e2e:ci

      # A different layer from the browser tests: these drive the row-level
      # security policies straight through the Data API.
      - name: Household RLS
        run: node scripts/test-household-flow.mjs

      - name: Recurring generation
        run: node scripts/test-recurring-flow.mjs

      - name: Budget scoping and RLS
        run: node scripts/test-budget-flow.mjs

      - name: Analytics RPC and RLS
        run: node scripts/test-analytics-flow.mjs

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup
