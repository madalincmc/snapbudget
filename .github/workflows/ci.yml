name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Node the project is developed against; the README asks
          # for 20+.
          node-version: 22
          cache: npm

      # `ci` rather than `install`: it installs exactly what the lockfile
      # pins and fails if package.json and the lockfile have drifted apart.
      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      # Catches what the checks above cannot: a Server Component that only
      # fails when Next actually renders it.
      - name: Build
        run: npm run build
        env:
          # The build imports modules that read these at module scope. They are
          # never contacted here — the values only need to exist and be
          # well-formed, so no secret is required to verify a pull request.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

# Deliberately not run here: scripts/test-*.mjs. Those 81 checks exercise the
# real row-level security policies through the Data API, which needs the
# service-role key and writes to a live database. On a public repository that
# key would have to live in Actions secrets, so they stay manual — run them
# before merging anything that touches supabase/migrations.
